[package]
name = "zalo-cookie-getter"
version = "0.1.0"
edition = "2021"
description = "Lấy cookie + imei Zalo bằng QR cho bot Rust (ghi account.json + cookie.json)"
license = "MIT"

[[bin]]
name = "zalo-cookie-getter"
path = "src/main.rs"

[lib]
name = "zalo_cookie_getter"
path = "src/lib.rs"

[dependencies]
zalo-rs = { git = "https://github.com/DEVTRAN07/Zalo-rs", rev = "d2ba2818" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest_cookie_store = "0.8"
cookie_store = "0.21"

[profile.release]
opt-level = 2
